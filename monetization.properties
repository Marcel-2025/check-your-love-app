# ---------------------------------------------------------------------------
# Monetarisierungs-Konfiguration für CheckYourLove
#
# Diese Werte sind KEINE Geheimnisse (sie stehen ohnehin in jeder APK).
# Debug-Builds verwenden IMMER die offiziellen Google-Testanzeigen und ignorieren
# die Werbe-IDs unten. Jeder Wert kann auch per Gradle-Property überschrieben
# werden, z. B.:  ./gradlew assembleRelease -Pcyl.admobAppId=ca-app-pub-...~...
#
# Leere Werte bedeuten "nicht konfiguriert":
#   - Release-Build ohne cyl.admobAppId bricht mit einer klaren Meldung ab
#     (das Werbe-SDK startet ohne App-ID nicht).
#   - Leere Anzeigenblock-ID -> dieses Werbeformat ist im Release deaktiviert.
#   - Leere cyl.premiumProductId -> Premium-Kauf im Release deaktiviert,
#     im Debug-Build steht stattdessen eine deutlich markierte Simulation bereit.
# Details: docs/MONETARISIERUNG.md
# ---------------------------------------------------------------------------

# AdMob-App-ID (Format ca-app-pub-XXXXXXXXXXXXXXXX~YYYYYYYYYY) – aus der AdMob-Konsole
cyl.admobAppId=ca-app-pub-5414395840028991~1169295264

# Banner-Anzeigenblock aus der bisherigen App-Version (Publisher 5414395840028991)
cyl.admobBannerId=ca-app-pub-5414395840028991/4122761666

# Interstitial-Anzeigenblock
cyl.admobInterstitialId=ca-app-pub-5414395840028991/3574734687

# Prämien-Anzeigenblock (freiwilliges Video für 24-h-Freischaltungen)
cyl.admobRewardedId=ca-app-pub-5414395840028991/8025864012
# Format dieses Blocks in AdMob: rewarded_interstitial (= „Interstitial mit Prämie“) oder rewarded (= „Mit Prämie“).
# Muss zum Format des Blocks passen, sonst lädt keine Anzeige.
cyl.admobRewardedFormat=rewarded_interstitial

# Produkt-ID des einmaligen Premium-Kaufs (Play Console > Monetarisieren > In-App-Produkte)
cyl.premiumProductId=

# Base64-codierter öffentlicher Lizenzschlüssel (Play Console > Monetarisierungseinrichtung).
# Öffentlich, kein Geheimnis. Wird zur Signaturprüfung von Käufen verwendet.
cyl.playLicenseKey=

# Öffentlich erreichbare Datenschutzerklärung (Pflicht bei Werbung). Leer = Menüpunkt ausgeblendet.
cyl.privacyPolicyUrl=
